<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Almond — Character Room</title>
<style>
:root{color-scheme:dark;--bg:#120b10;--panel:#20131b;--panel2:#2b1a24;--line:#50303e;--text:#f8eaf0;--muted:#c3a6b3;--accent:#f09abb;--accent2:#a94970;--danger:#ff9696}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,Segoe UI,sans-serif}body[data-theme=brown]{--bg:#17110d;--panel:#241a14;--panel2:#302218;--line:#59402e;--text:#f3e6d7;--muted:#c2aa91;--accent:#d7a078;--accent2:#9c6348}body[data-theme=mono]{--bg:#101010;--panel:#1a1a1a;--panel2:#252525;--line:#3c3c3c;--text:#f1f1f1;--muted:#aaa;--accent:#dedede;--accent2:#777}button,input,textarea,select{font:inherit}button{cursor:pointer;color:var(--text);background:var(--panel2);border:1px solid var(--line);padding:9px 12px;border-radius:6px}button:hover{border-color:var(--accent)}button.primary{background:var(--accent2)}button:disabled{opacity:.5}input,textarea,select{width:100%;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px}textarea{resize:vertical;min-height:82px}.app{display:grid;grid-template-columns:250px minmax(0,1fr);height:100dvh}.side{background:var(--panel);border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:12px;overflow:auto}.brand{font:34px Georgia,serif}.sub,.muted{color:var(--muted);font-size:12px}.eyebrow{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}.characters{display:flex;flex-direction:column;gap:6px}.character{display:flex;gap:9px;align-items:center;text-align:left;background:transparent;border-color:transparent}.character.active{background:var(--panel2);border-color:var(--line)}.avatar{width:40px;height:40px;flex-shrink:0;border-radius:6px;background:var(--accent2);display:grid;place-items:center;overflow:hidden;font:20px Georgia}.avatar img{width:100%;height:100%;object-fit:cover}.name{font-weight:650}.small{font-size:11px;color:var(--muted)}.two{display:grid;grid-template-columns:1fr 1fr;gap:6px}.sidefoot{margin-top:auto}.main{display:flex;min-width:0;flex-direction:column;height:100dvh}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}.title{font:25px Georgia,serif}.actions{display:flex;gap:6px;flex-wrap:wrap}.chat{flex:1;overflow:auto;padding:22px max(14px,calc((100% - 780px)/2));display:flex;flex-direction:column;gap:14px}.message{max-width:88%;align-self:flex-start}.message.user{align-self:flex-end}.who{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}.bubble{white-space:pre-wrap;overflow-wrap:anywhere;padding:12px 14px;border:1px solid var(--line);background:var(--panel);border-radius:8px}.user .bubble{background:var(--panel2);border-color:var(--accent2)}.compose{padding:12px 18px;border-top:1px solid var(--line)}.composeinner{display:flex;gap:8px;max-width:900px;margin:auto;align-items:flex-end}.compose textarea{min-height:48px;max-height:170px;flex:1}.status{font-size:11px;color:var(--muted);max-width:900px;margin:6px auto 0}.error{color:var(--danger)}.modalbg{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:14px;z-index:9}.modal{background:var(--panel);border:1px solid var(--line);padding:20px;width:min(700px,100%);max-height:90dvh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modal h2{font:26px Georgia,serif;font-weight:400;margin:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}.full{grid-column:1/-1}.modalactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.hidden{display:none!important}.greeting{margin:auto;text-align:center;color:var(--muted);max-width:420px}.greeting h2{font:32px Georgia,serif;color:var(--text);font-weight:400}@media(max-width:720px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr}.side{max-height:205px;padding:9px;gap:7px;border-right:0;border-bottom:1px solid var(--line)}.brand{font-size:25px}.characters{flex-direction:row;overflow:auto}.character{min-width:150px}.sidefoot{display:none}.main{height:calc(100dvh - 205px)}.top{padding:10px}.title{font-size:20px}.chat{padding:14px 10px}.message{max-width:95%}.grid{grid-template-columns:1fr}.full{grid-column:auto}.actions button{padding:7px;font-size:12px}}
</style></head><body data-theme="wine"><div class="app"><aside class="side"><div><div class="brand">almond</div><div class="sub">your private character room</div></div><div class="eyebrow">Your characters</div><div id="characters" class="characters"></div><div class="two"><button id="new">+ Character</button><button id="import">Import</button><button id="export">Export</button><button id="backup">Backup</button></div><button id="settings">Settings</button><div class="sidefoot"><div class="eyebrow">Local-first</div><p class="small">Your chats, characters and memories stay in this browser. Export a backup before clearing browser data.</p><button id="memory">Saved memory</button></div></aside><main class="main"><header class="top"><div><div id="activeName" class="title">Jimin</div><div id="activeSub" class="sub">Testing character · saved locally</div></div><div class="actions"><button id="edit">Edit</button><button id="memtop">Memory</button><button id="clear">Clear chat</button></div></header><section id="chat" class="chat" aria-live="polite"></section><div class="compose"><div class="composeinner"><textarea id="message" placeholder="Write a message… (Enter to send)"></textarea><button class="primary" id="send">Send</button></div><div id="status" class="status">Add a Groq API key in Settings to start chatting.</div></div></main></div><div id="modal"></div><input id="file" type="file" accept=".json,application/json" class="hidden">
<script>
(function(){
const $=id=>document.getElementById(id),KEY='almond.local.v2';
const jimin={id:'jimin-test',name:'Jimin',subtitle:'Testing character · warm, playful, attentive',avatar:'',description:'A fictional roleplay character inspired by the public persona of BTS member Park Jimin. Unofficial fan-made character, not the real person.',personality:'Warm, affectionate, playful, perceptive, a little teasing, emotionally attentive. Natural and specific; avoid repetitive pet names and melodrama.',scenario:'A quiet evening after a long day. You know each other well and are spending time somewhere comfortable.',style:'Write immersive, natural roleplay with dialogue and occasional concise action in asterisks. Do not control the user’s thoughts, feelings, or actions.',memory:'The user is testing Almond. Keep the conversation easy to continue. Do not assume relationship status or invent shared history; let it develop through chat.',chats:[{role:'assistant',content:'You made it. *He shifts over to make room beside him.* Come sit with me for a while. How was your day, really?',ts:Date.now()}]};
function fresh(){return {characters:[JSON.parse(JSON.stringify(jimin))],activeId:jimin.id,settings:{endpoint:'https://api.groq.com/openai/v1/chat/completions',model:'openai/gpt-oss-20b',apiKey:'',theme:'wine',temperature:0.9,maxTokens:700}}}
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.characters)&&x.characters.length){x.settings=Object.assign(fresh().settings,x.settings||{});return x}}catch(e){}return fresh()}
let state=load(),active=state.activeId||state.characters[0].id,busy=false;
function save(){state.activeId=active;localStorage.setItem(KEY,JSON.stringify(state))}
function c(){return state.characters.find(x=>x.id===active)||state.characters[0]}
function esc(s){return String(s||'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function avatar(x){return x.avatar?'<img src="'+esc(x.avatar)+'" alt="">':esc((x.name||'?').slice(0,1).toUpperCase())}
function render(){document.body.dataset.theme=state.settings.theme||'wine';$('characters').innerHTML=state.characters.map(x=>'<button class="character '+(x.id===active?'active':'')+'" data-id="'+esc(x.id)+'"><div class="avatar">'+avatar(x)+'</div><div><div class="name">'+esc(x.name)+'</div><div class="small">'+esc(x.subtitle||'Character')+'</div></div></button>').join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{active=b.dataset.id;render()});$('activeName').textContent=c().name;$('activeSub').textContent=c().subtitle||'Character chat · saved locally';$('status').textContent=state.settings.apiKey?'Groq key saved in this browser.':'Add a Groq API key in Settings to start chatting.';let box=$('chat');box.innerHTML=c().chats.length?'':'<div class="greeting"><h2>A room of your own.</h2><p>Your conversations and character memory are saved in this browser.</p></div>';c().chats.forEach(m=>{box.innerHTML+='<div class="message '+(m.role==='user'?'user':'assistant')+'"><div class="who">'+(m.role==='user'?'You':esc(c().name))+'</div><div class="bubble">'+esc(m.content)+'</div></div>'});if(busy)box.innerHTML+='<div class="message assistant"><div class="who">'+esc(c().name)+'</div><div class="bubble">Thinking…</div></div>';box.scrollTop=box.scrollHeight;save()}
function close(){ $('modal').innerHTML=''}
function open(title,body){$('modal').innerHTML='<div class="modalbg"><div class="modal"><div class="modalhead"><h2>'+title+'</h2><button id="close">Close</button></div>'+body+'</div></div>';$('close').onclick=close;$('modal').firstChild.onclick=e=>{if(e.target.classList.contains('modalbg'))close()}}
function field(label,id,val,full,placeholder,type){return '<div class="field '+(full?'full':'')+'"><label for="'+id+'">'+label+'</label><input id="'+id+'" type="'+(type||'text')+'" value="'+esc(val||'')+'" placeholder="'+esc(placeholder||'')+'"></div>'}
function area(label,id,val){return '<div class="field full"><label for="'+id+'">'+label+'</label><textarea id="'+id+'">'+esc(val||'')+'</textarea></div>'}
function settings(){let s=state.settings;open('Settings','<div class="grid">'+field('Groq API endpoint','endpoint',s.endpoint,true,'','text')+field('Model ID','model',s.model,true,'','text')+field('Groq API key','apiKey',s.apiKey,true,'Paste your key from console.groq.com/keys','password')+'<div class="field full"><label>Colour theme</label><select id="theme"><option value="wine">Rich maroon and pink</option><option value="brown">Dark brown and beige</option><option value="mono">Black and grey</option></select></div><p class="small full">Your API key is stored only in this browser and is never included in the GitHub files. Anyone using this browser profile could access it. Groq free-tier models and limits can change.</p></div><div class="modalactions"><button class="primary" id="saveSettings">Save settings</button><button id="test">Test connection</button><a href="https://console.groq.com/keys" target="_blank" rel="noreferrer">Create a Groq key ↗</a></div><div id="settingStatus" class="status"></div>');$('theme').value=s.theme||'wine';$('saveSettings').onclick=()=>{state.settings={...state.settings,endpoint:$('endpoint').value.trim(),model:$('model').value.trim(),apiKey:$('apiKey').value.trim(),theme:$('theme').value};close();render()};$('test').onclick=async()=>{let st=$('settingStatus');st.textContent='Testing…';st.className='status';try{let r=await fetch($('endpoint').value.trim(),{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+$('apiKey').value.trim()},body:JSON.stringify({model:$('model').value.trim(),messages:[{role:'user',content:'Reply only: Almond connected.'}],max_tokens:20})});let d=await r.json();if(!r.ok)throw Error(d.error?.message||'HTTP '+r.status);st.textContent='Connected: '+(d.choices?.[0]?.message?.content||'API responded.')}catch(e){st.textContent='Connection failed: '+e.message+' — check key/model and browser CORS.';st.className='status error'}}}
function editChar(isNew){let old=isNew?{name:'',subtitle:'',avatar:'',description:'',personality:'',scenario:'',style:'',memory:'',chats:[]}:c();open(isNew?'Create character':'Edit character','<div class="grid">'+field('Name','cn',old.name,true,'Character name')+field('Subtitle','cs',old.subtitle,false,'Short description')+field('Avatar image URL','ca',old.avatar,true,'https://…')+field('First message','cf',old.chats.length?'':(old.firstMessage||''),true,'Optional opening message')+area('Character description','cd',old.description)+area('Personality','cp',old.personality)+area('Scenario','csc',old.scenario)+area('Writing style','cst',old.style)+area('Persistent memory','cm',old.memory)+'</div><div class="modalactions"><button class="primary" id="saveChar">Save character</button>'+(isNew?'':'<button id="deleteChar">Delete character</button>')+'</div>');$('saveChar').onclick=()=>{let x={...old,id:old.id||('char-'+Date.now()),name:$('cn').value.trim()||'New character',subtitle:$('cs').value.trim(),avatar:$('ca').value.trim(),firstMessage:$('cf').value.trim(),description:$('cd').value,personality:$('cp').value,scenario:$('csc').value,style:$('cst').value,memory:$('cm').value,chats:old.chats||[]};if(isNew){if(x.firstMessage)x.chats.push({role:'assistant',content:x.firstMessage,ts:Date.now()});state.characters.push(x);active=x.id}else state.characters=state.characters.map(a=>a.id===x.id?x:a);close();render()};if(!isNew)$('deleteChar').onclick=()=>{if(state.characters.length===1){alert('Keep at least one character.');return}if(confirm('Delete this character and its chat?')){state.characters=state.characters.filter(x=>x.id!==old.id);active=state.characters[0].id;close();render()}}}
function memory(){open('Saved memory','<p class="small">This note is included in this character’s prompt and saved locally. You can edit it anytime.</p>'+area('Memory for '+esc(c().name),'memoryText',c().memory)+'<div class="modalactions"><button class="primary" id="saveMemory">Save memory</button><button id="summarize">Summarize recent chat</button></div><div id="memStatus" class="status"></div>');$('saveMemory').onclick=()=>{c().memory=$('memoryText').value;save();close();render()};$('summarize').onclick=async()=>{let st=$('memStatus');try{if(!state.settings.apiKey)throw Error('Add your Groq key in Settings first.');st.textContent='Summarizing…';let result=await api([{role:'system',content:'Write a concise persistent memory from this roleplay. Preserve established facts, preferences, important events and unresolved threads. Do not invent facts. Return only the memory.'},{role:'user',content:'Existing memory:\n'+c().memory+'\n\nChat:\n'+c().chats.slice(-40).map(m=>m.role+': '+m.content).join('\n')}],false);c().memory=result;$('memoryText').value=result;save();st.textContent='Memory saved.'}catch(e){st.textContent=e.message;st.className='status error'}}}
async function api(messages,stream,onChunk){let s=state.settings;if(!s.apiKey)throw Error('Add a Groq API key in Settings first.');let r=await fetch(s.endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.apiKey},body:JSON.stringify({model:s.model,messages,temperature:Number(s.temperature)||0.9,max_tokens:Number(s.maxTokens)||700,stream:!!stream})});if(!r.ok){let msg='HTTP '+r.status;try{let d=await r.json();msg=d.error?.message||msg}catch(e){}throw Error(msg)}if(!stream){let d=await r.json();return d.choices?.[0]?.message?.content||''}let reader=r.body.getReader(),dec=new TextDecoder(),buf='',out='';while(true){let x=await reader.read();if(x.done)break;buf+=dec.decode(x.value,{stream:true});let lines=buf.split('\n');buf=lines.pop()||'';for(let line of lines){if(!line.startsWith('data:'))continue;let raw=line.slice(5).trim();if(raw==='[DONE]')return out;try{let d=JSON.parse(raw),part=d.choices?.[0]?.delta?.content;if(part){out+=part;if(onChunk)onChunk(out)}}catch(e){}}}return out}
async function send(){if(busy)return;let text=$('message').value.trim();if(!text)return;if(!state.settings.apiKey){settings();return}let x=c();x.chats.push({role:'user',content:text,ts:Date.now()});$('message').value='';busy=true;render();let row=document.createElement('div');row.className='message assistant live';row.innerHTML='<div class="who">'+esc(x.name)+'</div><div class="bubble">Thinking…</div>';$('chat').appendChild(row);$('chat').scrollTop=$('chat').scrollHeight;try{let msgs=[{role:'system',content:'You are roleplaying as '+x.name+'. Character description: '+x.description+'\\nPersonality: '+x.personality+'\\nScenario: '+x.scenario+'\\nStyle: '+x.style+'\\nPersistent memory: '+x.memory+'\\nStay consistent with the character. Never claim to be the real person if this is a fan character.'}].concat(x.chats.slice(-30).map(m=>({role:m.role,content:m.content})));let answer=await api(msgs,true,out=>{row.querySelector('.bubble').textContent=out;$('chat').scrollTop=$('chat').scrollHeight});x.chats.push({role:'assistant',content:answer||'(No response received.)',ts:Date.now()})}catch(e){x.chats.push({role:'assistant',content:'[Connection error] '+e.message,ts:Date.now()})}finally{busy=false;render()}}$('send').onclick=send;$('message').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('new').onclick=()=>editChar(true);$('edit').onclick=()=>editChar(false);$('settings').onclick=null;document.addEventListener('click',function(e){const b=e.target.closest('#settings');if(b){e.preventDefault();settings()}});$('memory').onclick=memory;$('memtop').onclick=memory;$('clear').onclick=()=>{if(confirm('Clear this character’s chat history?')){c().chats=[];render()}};$('export').onclick=()=>download(c().name.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.json',JSON.stringify(c(),null,2));$('backup').onclick=()=>download('almond-backup.json',JSON.stringify(state,null,2));$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(d.characters&&Array.isArray(d.characters)){state=d;active=state.activeId||state.characters[0].id}else if(d.name&&d.id){if(state.characters.some(x=>x.id===d.id))d.id=d.id+'-'+Date.now();state.characters.push(d);active=d.id}else throw Error('This file is not an Almond character or backup JSON.');save();render();alert('Import complete.')}catch(err){alert('Import failed: '+err.message)}e.target.value=''};function download(name,data){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;a.click();URL.revokeObjectURL(a.href)}render();
})();
</script></body></html>
